model:
  act: tanh # None, tanh, relu or sigmoid
  hidden_layer: True
  dino_embed_dim: 768
  # ProjectionLayer uses this as the input text-feature dimension.
  # CLIP ViT-B/16 = 512; LLaMA3-8B hidden size = 4096.
  clip_embed_dim: 4096

train:
  lr: 0.0001
  ltype: 'infonce'
  num_epochs: 100
  batch_size: 128
  save_best_model: False
